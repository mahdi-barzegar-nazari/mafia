<!--
    مافیا
    ساخته شده توسط مهدی (Mahdi) — آبان ۱۴۰۵ (Oct 2026)
-->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="meta-theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
    <meta name="description" content="دستیار راوی برای بازی دورهمی مافیا - نسخه تحت وب، بدون نیاز به نصب" data-i18n-attr="content:meta.description">
    <meta property="og:title" content="مافیا">
    <meta property="og:description" content="دستیار راوی برای بازی دورهمی مافیا - نسخه تحت وب، بدون نیاز به نصب">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/icons/icon-512.png">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none';">
    <script src="./js/preinit.js"></script>
    <link rel="icon" href="data:image/svg+xml;charset=UTF-8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./css/style.css">
    <title data-i18n="meta.title">مافیا - دستیار راوی بازی دورهمی</title>
</head>
<body data-theme="default">

<div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

<button type="button" id="btn-install-app" class="install-btn-floating hidden" aria-label="نصب برنامه روی گوشی" data-i18n="install.text" data-i18n-attr="aria-label:install.aria">⬇️ نصب برنامه روی گوشی</button>

<main class="app-container" id="main-content-root">
    <header class="header-bar">
        <div class="flex-row-gap-8 u-items-center">
            <label for="theme-selector" class="sr-only" data-i18n="header.theme.label">انتخاب پوسته</label>
            <select id="theme-selector" class="input-control btn-sm w-auto p-4-8">
                <option value="default" data-i18n="theme.default">🌌 نئون کهکشانی</option>
                <option value="noir" data-i18n="theme.noir">🕵️ نوآر کلاسیک</option>
                <option value="classic" data-i18n="theme.classic">🎞️ سینمای کلاسیک</option>
                <option value="emerald" data-i18n="theme.emerald">🌲 جنگل زمرد</option>
                <option value="crimson" data-i18n="theme.crimson">🔥 شعله سرخ</option>
                <option value="sunset" data-i18n="theme.sunset">🌇 میراژ غروب</option>
                <option value="cyber" data-i18n="theme.cyber">🤖 سایبرپانک</option>
                <option value="ocean" data-i18n="theme.ocean">🧊 اقیانوس یخی</option>
            </select>
        </div>
    </header>

    <section id="screen-welcome" class="screen-view">
        <div id="install-hint" class="install-hint hidden">
            <span id="install-hint-ios" class="install-hint-text hidden" data-i18n="install.hint.ios">اشتراک‌گذاری، سپس «افزودن به صفحه اصلی»</span>
            <span id="install-hint-firefox-android" class="install-hint-text hidden" data-i18n="install.hint.firefoxAndroid">منو، سپس «نصب» یا «افزودن به صفحه اصلی»</span>
            <span id="install-hint-ios-in-app" class="install-hint-text hidden" data-i18n="install.hint.iosInApp">برای نصب، این صفحه را در Safari باز کنید</span>
            <button type="button" id="btn-install-hint-close" class="install-hint-close" aria-label="بستن راهنمای نصب" data-i18n-attr="aria-label:install.hint.close.aria">×</button>
        </div>
        <h1 id="welcome-title" data-i18n="welcome.title">🎭 مافیا</h1>
        <p data-i18n="welcome.tagline">دستیار راوی برای اداره‌ی بازی دورهمی مافیا.</p>

        <div class="play-hero">
            <button type="button" class="play-button" id="btn-nav-setup" aria-label="شروع بازی" data-i18n-attr="aria-label:welcome.start.aria">
                <span class="play-button-icon" aria-hidden="true"></span>
            </button>
            <span class="play-button-label" data-i18n="welcome.start.label">شروع بازی</span>
            <span class="play-button-caption" data-i18n="welcome.start.caption">یک گوشی، در دست راوی</span>
        </div>
        <div class="lang-switch-wrap" dir="ltr">
            <div class="lang-switch" role="group" aria-label="زبان" data-i18n-attr="aria-label:welcome.lang.aria">
                <button type="button" id="btn-lang-fa" class="btn btn-ghost btn-sm lang-btn" lang="fa" data-lang="fa" aria-pressed="true">فارسی</button>
                <button type="button" id="btn-lang-en" class="btn btn-ghost btn-sm lang-btn" lang="en" data-lang="en" aria-pressed="false">English</button>
            </div>
        </div>
        <p class="credit-line"><a href="https://www.instagram.com/mhd.barzegar" target="_blank" rel="noopener noreferrer" class="credit-link" aria-label="صفحه سازنده" data-i18n="welcome.credit.author" data-i18n-attr="aria-label:welcome.credit.author.aria">ساخته شده توسط مهدی</a> · <a href="https://www.coffeete.ir/MahdiBN" target="_blank" rel="noopener noreferrer" class="credit-link credit-link-coffee" aria-label="حمایت مالی از سازنده" data-i18n-attr="aria-label:welcome.credit.support.aria">☕</a></p>
        <p id="build-info" class="credit-line build-info hidden" dir="ltr" translate="no"></p>
    </section>

    <section id="screen-setup" class="screen-view hidden">
        <h2 data-i18n="setup.title">تنظیمات بازی</h2>
        <div class="input-group">
            <label for="setup-players-count" data-i18n="setup.players.label">تعداد بازیکنان:</label>
            <input type="text" id="setup-players-count" class="input-control" value="8" inputmode="numeric" autocomplete="off" aria-describedby="players-limit-hint">
            <div id="players-limit-hint" class="field-hint"></div>
        </div>
        <button type="button" id="btn-back-welcome-2" class="btn btn-ghost" data-i18n="setup.back">بازگشت</button>
    </section>
</main>

<div id="confirm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="modal-card">
        <h3 id="confirm-modal-title" data-i18n="confirm.title">تایید</h3>
        <p id="confirm-modal-text" data-i18n="confirm.text">مطمئن هستید؟</p>
        <button type="button" id="btn-confirm-yes" class="btn btn-rose" data-i18n="confirm.yes">بله</button>
        <button type="button" id="btn-confirm-no" class="btn btn-ghost" data-i18n="confirm.no">انصراف</button>
    </div>
</div>

<noscript>
    <p class="noscript-message">این برنامه برای اجرا به جاوااسکریپت نیاز دارد. لطفاً جاوااسکریپت را فعال کنید.</p>
</noscript>

<script type="module" src="./js/main.js"></script>
</body>
</html>
